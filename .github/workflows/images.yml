# Builds both images and publishes them to the GitHub container registry, so running either needs only
# `docker compose pull` on whatever host it runs on - no clone, no build, nothing but docker there.
#
#   ghcr.io/zorntaov/comics-updater   the updater (Dockerfile)
#   ghcr.io/zorntaov/comic-reader     the reader (reader/Dockerfile, built from the root for comiclib)
#
# main is published as :latest, a v1.2.3 tag as :1.2.3 and :1.2 as well, and every build as :sha-<commit>
# so a host can pin to one that worked. amd64 and arm64 both, since a NAS can be either.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
    # only what goes into an image: a change to the tests or the docs publishes nothing new
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - "*.py"
      - comiclib/**
      - web_page/**
      - reader/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: comics-updater
            dockerfile: Dockerfile
          - name: comic-reader
            dockerfile: reader/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr wants the owner in lower case, which the account name is not
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # each image keeps its own cache, so one's layers never push out the other's
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
