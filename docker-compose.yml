# Container Station -> Applications -> Create, or `docker compose up -d` over ssh.
# The image is built separately and on purpose, and carries the scripts as well as python and chromium,
# so it runs with nothing but a library and a settings folder mounted:
#
#     docker build -t comics-updater:1.0 .
#
# There is deliberately no `build:` key here. Container Station tries to build for itself when it
# finds one, from a context it does not have, and ends up with a second image entry that holds
# nothing useful. Building by hand keeps one image with one tag.
services:
  comics:
    image: comics-updater:1.0
    container_name: comics-updater
    restart: unless-stopped

    # CHANGE ME: must match the owner of the library folder, which `ls -n` will tell you. Without it
    # scraped pages land owned by root and whatever shares the library cannot read them.
    user: "1001:100"

    environment:
      # CHANGE ME, and do not leave it out: without this the container runs on UTC and the schedule
      # fires at the wrong hour.
      TZ: America/Los_Angeles

      # OPTIONAL: a password for the web page. Without one, anyone who can reach the port can start
      # scrapes. The browser asks for a username too; any will do.
      # MIRROR_WEB_PASSWORD: change-me

    # the web page, at http://<nas address>:8081/. Change the left number to use another port.
    ports:
      - "8081:8081"

    volumes:
      # CHANGE ME: the library root, the folder holding CBZs/ and Uncompressed/. Always mounted at
      # /library, because comics are addressed by paths relative to it in their metadata.
      - /share/Media/Comics:/library

      # CHANGE ME: a folder for the settings - ComicScraper.json, the element paths the web page edits,
      # and index/, the record of which page is which. Without it they live inside the container and are
      # lost whenever it is recreated. An empty folder is fine; it fills itself.
      - /share/Container/ComicScraper/config:/app/config

      # OPTIONAL, instead of the line above: run the scripts from a folder on the share rather than the
      # copies built into the image, so an edit needs a container restart rather than an image build.
      # The folder has to hold everything the image does - the five .py scripts, web_ui.html and the
      # comiclib/ folder - and its own config/, which then does the job of the line above, so drop that
      # one. An empty or missing path here mounts an empty /app and nothing will start.
      #
      # - /share/Container/ComicScraper:/app

    # chromium wants more than docker's default 64m of shared memory
    shm_size: 512m

    # Container Station rejects mem_limit here and wants it in Advanced Settings instead.
    # One headless chromium is a few hundred MB, so 4 GB is headroom rather than a target.

    # --schedule keeps the container alive and runs at that local time daily.
    # Raise --jobs to update several comics at once; each one is its own browser.
    # Add "--now" to update once on startup too, rather than sitting idle until the first 03:30.
    # --web serves the page for watching runs, starting updates and adding comics; drop it to go without.
    command: ["--schedule", "03:30", "--jobs", "2", "--web", "8081"]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
