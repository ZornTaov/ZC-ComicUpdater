# `docker compose up -d` beside this file, or hand it to whatever runs compose files on your host - a NAS's
# container app, Portainer and the like. The image is published from the repository, and carries the
# scripts as well as python and chromium, so it runs with nothing but a library and a settings folder
# mounted. `docker compose pull && docker compose up -d` takes a newer one.
#
# There is deliberately no `build:` key here: some compose GUIs try to build for themselves when they find
# one, from a context they do not have, and end up with a second image that holds nothing useful. To run
# an image of your own instead, build it from the repo root and put its tag below:
#
#     docker build -t zcm-updater:local .
services:
  comics:
    # :latest is the newest release; :1.2.0 pins one, :nightly is main as of last night
    image: ghcr.io/zorntaov/zcm-updater:latest
    container_name: zcm-updater
    restart: unless-stopped

    # CHANGE ME: must match the owner of the library folder, which `ls -n` will tell you. Without it
    # scraped pages land owned by root and whatever shares the library cannot read them.
    user: "1001:100"

    environment:
      # CHANGE ME, and do not leave it out: without this the container runs on UTC and the schedule
      # fires at the wrong hour.
      TZ: America/Los_Angeles

      # OPTIONAL: a password for the web page. Without one, anyone who can reach the port can start
      # scrapes. The browser asks for a username too; any will do.
      # MIRROR_WEB_PASSWORD: change-me

      # OPTIONAL: installing scraper plugins from the web page runs whatever they hold, so it is only
      # offered behind the password above. To allow it without one - a page only you can reach - say so here.
      # MIRROR_ALLOW_PLUGIN_INSTALLS: "yes"

    # the web page, at http://<host>:8081/. Change the left number to use another port.
    ports:
      - "8081:8081"

    volumes:
      # CHANGE ME: the library root, the folder holding CBZs/ and Uncompressed/. Always mounted at
      # /library, because comics are addressed by paths relative to it in their metadata.
      - /path/to/Comics:/library

      # CHANGE ME: a folder for the settings - ComicScraper.json, the element paths the web page edits,
      # and index/, the record of which page is which. Without it they live inside the container and are
      # lost whenever it is recreated. An empty folder is fine; it fills itself.
      - /path/to/ComicScraper/config:/app/config

      # OPTIONAL: a folder for each comic's run logs, kept a week and shown on the web page. Without it they
      # live inside the container and are lost whenever it is recreated.
      # - /path/to/ComicScraper/logs:/app/logs

      # OPTIONAL, instead of the line above: run the scripts from a folder on the host rather than the
      # copies built into the image, so an edit needs a container restart rather than a new image.
      # The folder has to hold everything the image does - the six .py scripts, the web_page/ and
      # comiclib/ folders - and its own config/, which then does the job of the line above, so drop that
      # one. An empty or missing path here mounts an empty /app and nothing will start.
      #
      # - /path/to/ComicScraper:/app

    # chromium wants more than docker's default 64m of shared memory
    shm_size: 512m

    # a memory limit is optional: one headless chromium is a few hundred MB, so 4 GB is headroom rather
    # than a target. some NAS container apps reject mem_limit here and want it in their own settings.
    # mem_limit: 4g

    # --schedule keeps the container alive and runs at that local time daily.
    # Raise --jobs to update several comics at once; each one is its own browser.
    # Add "--now" to update once on startup too, rather than sitting idle until the first 03:30.
    # --web serves the page for watching runs, starting updates and adding comics; drop it to go without.
    command: ["--schedule", "03:30", "--jobs", "2", "--web", "8081"]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
