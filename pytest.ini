# python -m pytest runs the whole suite, side by side. most of its time is a browser starting, which
# many can do at once. what stalled the rest of the machine was not the cpu or the gpu but the disk: every
# chrome making and deleting a profile of its own. with those shared from a pool (conftest.py) and the run
# below normal priority, eight workers leave room for a video playing beside it. -n 0 runs one at a time,
# for following a single test's output.
[pytest]
testpaths = tests
addopts = -n auto --maxprocesses=8
