# python -m pytest runs the whole suite, side by side. most of its time is a browser starting, which many
# can do at once. a run is felt on the rest of the machine whatever the worker count - a video playing beside
# it hitched at 16, 8, 6 and 4 - so it runs as many as help, and is over sooner. every chrome reuses a pooled
# profile and the run is below normal priority (conftest.py), which keep it as light as it can be. -n 0
# runs one at a time, for following a single test's output.
[pytest]
testpaths = tests
addopts = -n auto --maxprocesses=8
