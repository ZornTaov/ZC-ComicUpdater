# python -m pytest runs the whole suite, side by side. most of its time is a browser starting, which
# many can do at once - but each worker drives a chrome of its own, and sixteen of them at once took
# enough of the machine that whatever else it was doing, video above all, stuttered. six leaves the rest
# of the machine its own, for a run about twice as long. -n 16 asks for more when nothing else matters,
# and -n 0 runs one at a time, for following a single test's output.
[pytest]
testpaths = tests
addopts = -n auto --maxprocesses=6
