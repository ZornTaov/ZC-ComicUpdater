# python -m pytest runs the whole suite, side by side. most of its time is a browser starting, which
# many can do at once - but each worker drives a chrome of its own, and at sixteen, and still at six, a
# video playing beside the run hitched. four workers, all of it below normal priority (conftest.py), leaves
# the rest of the machine its own. -n 8 asks for more when nothing else matters, and -n 0 runs one at a
# time, for following a single test's output.
[pytest]
testpaths = tests
addopts = -n auto --maxprocesses=4
